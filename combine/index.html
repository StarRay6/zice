<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中医体质自测 · 九体＋五运六气合判</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f0e8d6'/%3E%3Crect x='6' y='6' width='20' height='20' fill='none' stroke='%23a83226' stroke-width='2'/%3E%3Cpath d='M11 21V11h4.6a3.4 3.4 0 0 1 0 6.8H11' fill='none' stroke='%232c2c2c' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{
  --bg1:#f5efe0; --bg2:#ede4cc; --paper:#f0e8d6;
  --card:#faf6ea; --card2:#fffdf5;
  --ink:#2c2c2c; --ink2:#8a7a5a;
  --line:#d4c5a0; --line2:#c9b88e; --line3:#e0d3b4;
  --brown:#b8a682; --tan:#d8c9a0; --tan2:#d8c9a8; --tanink:#5c4a28;
  --seal:#a83226; --seal2:#8b2820; --sealsoft:#e5d8b8;
  --warnbg:#fdf3dc; --warnline:#c9a96e; --warnink:#7a4a1a;
  --sans:system-ui,-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0 auto; max-width:800px; padding:44px 16px 16px;
  background:var(--paper); background-image:radial-gradient(ellipse at top,var(--bg1) 0%,var(--bg2) 100%);
  background-attachment:fixed; color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:800px; margin:0 auto}
/* 抬头 */
.masthead{text-align:center; border-bottom:1px solid var(--brown); padding-bottom:12px; margin:0 0 20px}
.masthead h1{font-size:26px; line-height:1.4; margin:0 0 6px; letter-spacing:.28em; text-indent:.28em; font-weight:700}
.masthead .sub{margin:0; color:var(--ink2); font-size:13px; line-height:1.8; letter-spacing:.02em}
.masthead .meta{margin:8px 0 0; color:var(--brown); font-size:11px; letter-spacing:.1em}
/* 必填/旧卷首（保留兼容） */
.preface{background:var(--card); border-left:3px solid var(--seal); padding:14px 16px; margin:0 0 20px}
.preface p{margin:0 0 8px; font-size:15px}
.preface p:last-child{margin:0}
.gate{display:grid; grid-template-columns:1fr; gap:10px; margin:0 0 24px; padding:14px 16px; border:1px solid var(--line)}
.gate label{display:block; font-size:14px; color:var(--ink2); margin-bottom:6px}
.gate select{width:100%; font-family:var(--sans); font-size:16px; padding:9px 10px; background:var(--card2); color:var(--ink); border:1px solid var(--line2); border-radius:4px}
/* 声明条 */
.warn{background:var(--warnbg); border:1px solid var(--warnline); border-radius:4px; padding:12px; color:var(--warnink); font-size:14px; line-height:1.8; margin:0 0 18px}
.warn b{font-weight:700; letter-spacing:.06em}
/* 逐题：进度与题头 */
.headline{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:13px; color:var(--ink2); letter-spacing:.06em; margin:0 0 8px}
.headline .seg{font-weight:700; color:var(--ink)}
.headline .stage{color:var(--seal); letter-spacing:.1em}
.headline .pct{font-variant-numeric:tabular-nums}
.track{height:6px; background:var(--tan2); border-radius:99px; overflow:hidden; margin:0 0 20px}
.track i{display:block; height:100%; background:var(--ink); width:0; transition:width .4s ease}
/* 题卡 */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:4px;
  box-shadow:0 2px 12px rgba(60,40,15,.1); padding:24px 20px; min-height:260px;
  display:flex; flex-direction:column; justify-content:center;
}
.card[hidden]{display:none}
.card .kicker{display:block; font-size:12px; letter-spacing:.12em; color:var(--ink2)}
.card h3{font-size:18px; line-height:1.7; margin:10px 0 20px; font-weight:700; letter-spacing:2px; color:var(--ink)}
.card .note{font-size:13px; color:var(--ink2); margin:0 0 14px; line-height:1.75}
.choices{display:grid; grid-template-columns:1fr}
.choice{
  display:flex; align-items:center; gap:10px; width:100%; min-height:48px; padding:14px 6px;
  background:transparent; border:0; border-bottom:1px solid var(--line3); border-radius:0; cursor:pointer;
  font-family:var(--sans); font-size:16px; line-height:1.6; color:var(--ink); text-align:left;
  transition:background .18s ease, color .18s ease;
}
.choice:hover{background:#f2ead2}
.choice.on{background:#f7e7cf; box-shadow:inset 3px 0 0 var(--seal); color:#5c2018; font-weight:700}
.choice:focus-visible{outline:2px solid var(--seal); outline-offset:-2px}
/* 五级程度：横排刻度，不做勾选框 */
.scale{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin:4px 0 0}
.segBtn{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  min-height:56px; padding:14px 2px; border:0; border-radius:4px; cursor:pointer;
  font-family:var(--sans); color:#5c4a28; transition:background .18s ease, box-shadow .18s ease, color .18s ease;
}
.segBtn b{font-size:15px; font-weight:700; letter-spacing:1px}
.segBtn i{font-style:normal; font-size:10px; opacity:.7; line-height:1.2}
.segBtn.t1{background:#fbf5e4}
.segBtn.t2{background:#f5ead0}
.segBtn.t3{background:#eedfbc}
.segBtn.t4{background:#e2cea0}
.segBtn.t5{background:#d4bb88}
.segBtn:hover{box-shadow:inset 0 0 0 1px #a89060}
.segBtn.on{background:var(--seal); color:#f7efe4; box-shadow:0 3px 12px rgba(168,50,38,.26)}
.segBtn.on i{opacity:.9}
.segBtn:focus-visible{outline:2px solid var(--seal); outline-offset:2px}
.scale-note{margin:12px 0 0; font-size:13px; color:var(--ink2); min-height:20px; line-height:1.6}
@media (max-width:430px){ .segBtn i{display:none} }
/* 底部按钮 */
.nav{position:sticky; bottom:0; background:var(--paper); border-top:1px solid var(--line); display:flex; gap:12px; align-items:center; padding:12px 0 10px; margin-top:22px; flex-wrap:wrap}
.nav .counter{flex:1 1 auto; min-width:96px; font-size:13px; color:var(--ink2)}
.nav button{flex:1 1 0}
button.primary{
  font-family:var(--sans); font-size:16px; padding:14px; min-height:48px; border:0; border-radius:4px;
  background:var(--seal); color:#f5efe0; cursor:pointer; letter-spacing:4px; transition:background .2s ease;
}
button.primary:hover{background:var(--seal2)}
button.primary:disabled{background:#c9b8a0; cursor:not-allowed}
button.ghost{
  font-family:var(--sans); font-size:16px; padding:14px; min-height:48px; border:0; border-radius:4px;
  background:var(--tan); color:var(--tanink); cursor:pointer; letter-spacing:2px; transition:background .2s ease;
}
button.ghost:hover{background:#cdbc93}
button.ghost:disabled{opacity:.5; cursor:not-allowed}
/* 结果区 */
#result{display:none}
.verdict{background:var(--card); border:1px solid var(--line); border-radius:4px; box-shadow:0 2px 12px rgba(60,40,15,.1); padding:20px; margin:0 0 16px}
.verdict .lead{font-size:12px; letter-spacing:.12em; color:var(--ink2); margin:0 0 10px}
.tags{margin:0 0 10px; display:flex; flex-wrap:wrap; gap:8px}
.tag{display:inline-block; padding:6px 12px; border-radius:2px; font-size:14px; letter-spacing:1px}
.tag-main{background:var(--seal); color:#f5efe0}
.tag-sub{background:var(--tan); color:var(--tanink)}
.verdict h3{font-size:26px; margin:0; line-height:1.4; letter-spacing:3px}
.verdict h3 em{font-style:normal; color:var(--seal)}
.verdict .also{font-size:14px; color:var(--ink2); margin:9px 0 0; line-height:1.8}
.bars{margin:0 0 16px; background:var(--card); border:1px solid var(--line); border-radius:4px; box-shadow:0 2px 12px rgba(60,40,15,.1); padding:18px 20px}
.bar-row{margin:0 0 12px}
.bar-head{display:flex; justify-content:space-between; font-size:14px; line-height:1.6}
.bar-head .v{font-variant-numeric:tabular-nums; color:var(--ink2)}
.gauge{position:relative; height:8px; background:var(--sealsoft); border-radius:99px; margin-top:5px; overflow:visible}
.gauge i{position:absolute; left:0; top:0; bottom:0; background:var(--seal); border-radius:99px}
.gauge i.hot{background:var(--seal2)}
.gauge b{position:absolute; top:-3px; bottom:-3px; width:1px; background:var(--ink2); opacity:.55}
.thr{font-size:12px; color:var(--ink2); margin:8px 0 0; line-height:1.7}
/* 展开行 */
.fold{border:1px solid var(--line); border-radius:4px; background:var(--card); margin:0 0 10px; overflow:hidden}
.fold-h{
  width:100%; text-align:left; background:transparent; border:0; cursor:pointer;
  font-family:var(--sans); color:var(--ink); padding:14px 18px; display:flex; gap:12px; align-items:baseline; min-height:48px;
}
.fold-h .t{flex:0 0 auto; font-weight:700; font-size:15px; letter-spacing:1px}
.fold-h .s{flex:1 1 auto; min-width:0; font-size:14px; color:var(--ink2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fold-h .x{flex:0 0 auto; font-size:13px; color:var(--ink2)}
.fold-b{display:none; padding:0 18px 16px; font-size:15px; line-height:1.9}
.fold-b p{margin:0 0 9px}
.fold.open .fold-b{display:block}
.fold.open .fold-h .x{color:var(--seal)}
.fold-h:hover .t{color:var(--seal)}
.fold-h:focus-visible{outline:2px solid var(--seal); outline-offset:2px}
.tagline{font-size:13px; color:var(--ink2); margin:0 0 6px}
/* 清单 */
.list-group{margin:0 0 12px; padding:14px; background:#f5ecd4; border-left:3px solid var(--seal); border-radius:0 4px 4px 0}
.list-group .who{font-size:14px; font-weight:700; margin:0 0 6px; color:#5c2018}
.list-good,.list-bad{margin:0 0 5px; font-size:15px; line-height:1.85}
.list-good b,.list-bad b{font-weight:700; margin-right:6px}
.list-good b{color:#5c4a28}
.list-bad b{color:var(--seal)}
.item-report{margin:0 0 10px; padding:14px; border-left:3px solid var(--seal); background:#f5ecd4; border-radius:0 4px 4px 0}
.item-report strong{color:#5c2018}
.foot{margin-top:26px; border-top:1px solid var(--line); padding-top:14px; font-size:13px; color:var(--ink2); line-height:1.9}
.foot p{margin:0 0 8px}
.row-actions{display:flex; gap:12px; flex-wrap:wrap; margin-top:18px}
/* 分享长图：遮罩 + 预览 */
.shot-mask{position:fixed; inset:0; z-index:130; background:rgba(26,20,12,.92); display:flex; align-items:flex-start; justify-content:center; padding:20px 14px 36px; overflow:auto; -webkit-overflow-scrolling:touch}
.shot-box{width:100%; max-width:720px; display:flex; flex-direction:column; gap:12px}
.shot-hint{margin:0; font-size:14px; line-height:1.7; color:var(--sealsoft); letter-spacing:.3px}
.shot-img{width:100%; height:auto; display:block; border-radius:4px; border:1px solid var(--line2); background:var(--card)}
.shot-acts{display:flex; gap:12px; flex-wrap:wrap}
.shot-acts a.primary{flex:1 1 180px; display:flex; align-items:center; justify-content:center; min-height:48px; padding:14px; border-radius:4px; background:var(--seal); color:#f5efe0; text-decoration:none; font-size:16px; letter-spacing:3px}
.shot-acts a.primary:hover{background:var(--seal2)}
.shot-acts button.ghost{flex:1 1 120px}
/* 出图方式选择（底部小面板，两个大按钮） */
.shot-pick{position:fixed; inset:0; z-index:135; background:rgba(26,20,12,.74); display:flex; align-items:flex-end; justify-content:center; padding:0}
.shot-pick-box{width:100%; max-width:520px; background:var(--card); border:1px solid var(--line2); border-radius:12px 12px 0 0; padding:20px 18px calc(24px + env(safe-area-inset-bottom)); box-shadow:0 -6px 24px rgba(40,28,12,.28)}
.shot-pick-t{margin:0 0 4px; font-size:17px; font-weight:700; letter-spacing:2px; color:var(--ink)}
.shot-pick-s{margin:0 0 14px; font-size:13px; line-height:1.7; color:var(--ink2)}
.shot-opt{display:block; width:100%; text-align:left; background:var(--card2); border:1px solid var(--line); border-radius:4px; padding:13px 16px; margin:0 0 10px; cursor:pointer; font-family:var(--sans); transition:background .16s ease}
.shot-opt:hover{background:#f7f0dd}
.shot-opt b{display:block; font-size:16px; letter-spacing:1px; color:var(--seal)}
.shot-opt span{display:block; margin-top:3px; font-size:13px; line-height:1.65; color:var(--ink2)}
.shot-pick-x{width:100%; margin-top:4px}
@media (min-width:560px){ .shot-pick{align-items:center} .shot-pick-box{border-radius:8px} }
/* 旧逐题样式（兼容保留） */
.intro{margin:0 0 8px}
.intro .hint{font-size:14px; color:var(--ink2); line-height:1.8; margin:0 0 16px}
.bar{position:sticky; bottom:0; background:var(--paper); border-top:1px solid var(--line); padding:12px 0 10px; margin-top:24px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.prog{flex:1 1 auto; min-width:140px; font-size:13px; color:var(--ink2)}
/* 浮层提示 */
.toast{
  position:fixed; left:50%; top:24%; transform:translateX(-50%) translateY(-16px);
  background:rgba(30,25,15,.92); color:#f5efe0; padding:12px 24px; border-radius:2px;
  font-size:14px; letter-spacing:1px; opacity:0; pointer-events:none;
  transition:opacity .25s ease, transform .25s ease; z-index:60; white-space:nowrap;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#deck{position:relative}
.card.shake{animation:shake .4s ease; border-color:#c0392b}
@media (min-width:768px){
  body{padding:52px 24px 20px}
  .masthead h1{font-size:30px}
  .card h3{font-size:19px}
  .verdict h3{font-size:32px}
}
@media print{
  .nav,.row-actions,.gate,button,.toast,.shot-mask,.shot-pick{display:none!important}
  body{background:#fff; background-image:none}
  .fold-b{display:block!important}
  .card,.verdict,.bars{box-shadow:none}
}
/* ===== 出生日期与运气卡（新增层） ===== */
.birth{display:grid; grid-template-columns:1.25fr 1fr 1fr; gap:10px; margin:6px 0 0}
.birth select{width:100%; min-width:0; font-family:var(--sans); font-size:16px; padding:12px 6px; min-height:48px;
  background:var(--card2); color:var(--ink); border:1px solid var(--line2); border-radius:4px; -webkit-appearance:none; appearance:none}
.birth select:focus-visible{outline:2px solid var(--seal); outline-offset:1px}
.birth-note{margin:14px 0 0; padding:11px 12px; background:#f5ecd4; border-left:3px solid var(--seal); font-size:14px; line-height:1.8; color:#5c2018}
.birth-note b{font-weight:700}
.birth-prev{display:flex; gap:9px; align-items:flex-start; margin:12px 0 0; font-size:14px; line-height:1.7; color:var(--ink2)}
.birth-prev[hidden]{display:none}
.birth-prev input{width:20px; height:20px; margin:2px 0 0; flex:0 0 auto}
.luck{background:var(--card); border:1px solid var(--line); border-radius:4px; box-shadow:0 2px 12px rgba(60,40,15,.1); padding:20px; margin:0 0 16px}
.luck .lead{font-size:12px; letter-spacing:.12em; color:var(--ink2); margin:0 0 10px}
.luck .big{font-size:25px; font-weight:700; letter-spacing:2px; margin:0 0 4px; color:var(--ink)}
.luck .subline{font-size:13px; color:var(--ink2); margin:0 0 12px; line-height:1.7}
.luck dl{display:grid; grid-template-columns:auto 1fr; gap:7px 14px; margin:0; font-size:15px; line-height:1.7}
.luck dt{color:var(--ink2); font-size:14px; white-space:nowrap}
.luck dd{margin:0; color:var(--ink)}
.luck .p{margin:14px 0 0; font-size:15px; line-height:1.9}
.luck .p b{color:#5c2018}
.luck .chips{display:flex; flex-wrap:wrap; gap:7px; margin:12px 0 0}
.luck .chip{font-size:13px; padding:3px 10px; border:1px solid var(--line2); border-radius:2px; color:#5c4a28; background:#f5ecd4}
.luck .fine{margin:12px 0 0; font-size:12px; color:var(--ink2); line-height:1.7}
.joint{background:var(--card); border:1px solid var(--line); border-radius:4px; box-shadow:0 2px 12px rgba(60,40,15,.1); padding:20px; margin:0 0 16px}
.joint .lead{font-size:12px; letter-spacing:.12em; color:var(--ink2); margin:0 0 12px}
.joint .kv{display:grid; grid-template-columns:76px 1fr; gap:10px; align-items:baseline; margin:0 0 8px; font-size:15px; line-height:1.7}
.joint .kv span{color:var(--ink2); font-size:14px}
.joint .kv strong{font-weight:700; color:var(--ink); min-width:0}
.joint .verdict-1{font-size:19px; line-height:1.6; font-weight:700; letter-spacing:1px; margin:14px 0 8px; color:var(--seal)}
.joint .p{margin:0 0 9px; font-size:15px; line-height:1.9}
@media (max-width:430px){ .joint .kv{grid-template-columns:64px 1fr} .luck .big{font-size:21px} }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1>中医体质自测</h1>
    <p class="sub">九种体质 · 判定 27 题＋补充 7 题 · 出生运气对照</p>
    <p class="meta">GB/T 46939—2025　＋　五运六气（大寒换年）</p>
  </header>

  <div class="warn"><b>重要声明</b>　本问卷仅为健康科普参考，<b>不能替代专业中医师面诊诊断</b>，不构成诊疗、用药建议，如有不适请及时就医。判定题按「近一年大多数时候」答，补充题按现在的情况答。出生年月日只用来推五运六气，按大寒换年，只算到日、不算时辰。</div>

  <section id="deckWrap">
    <div class="headline">
      <span class="seg" id="seg">第 1 题</span>
      <span class="stage" id="stage">性别</span>
      <span class="pct" id="pct">0%</span>
    </div>
    <div class="track"><i id="fill"></i></div>
    <div id="deck"></div>
    <nav class="nav">
      <button class="ghost" id="prev" disabled>上一题</button>
      <button class="primary" id="next">下一题</button>
    </nav>
  </section>

  <div class="toast" id="toast"></div>

  <section id="result" aria-live="polite"></section>

</div>

<script>
/* ================= 判定层 27 题（GB/T 46939—2025，题干照原文） ================= */
const OPTS5 = ["没有（根本不）","很少（有一点）","有时（有些）","经常（相当）","总是（非常）"];

const Q27 = [
 {id:"S01", t:"您精力充沛吗？", k:[["pinghe",0]]},
 {id:"S02", t:"您容易疲乏吗？", k:[["pinghe",1],["qixu",0]]},
 {id:"S03", t:"您感到闷闷不乐、情绪低沉吗？", k:[["pinghe",1],["qiyu",0]]},
 {id:"S04", t:"您比一般人耐受不了寒冷（冬天的寒冷，夏天的冷空调、电扇等）吗？", k:[["pinghe",1],["yangxu",0]]},
 {id:"S05", t:"您容易气短（呼吸短促，接不上气）吗？", k:[["qixu",0]]},
 {id:"S06", t:"您容易心慌吗？", k:[["qixu",0]]},
 {id:"S07", t:"您胃脘部、背部或腰膝部怕冷吗？", k:[["yangxu",0]]},
 {id:"S08", t:"您感到怕冷、衣服比别人穿得多吗？", k:[["yangxu",0]]},
 {id:"S09", t:"您感觉身体、脸上发热吗？", k:[["yinxu",0]]},
 {id:"S10", t:"您皮肤或口唇干吗？", k:[["yinxu",0]]},
 {id:"S11", t:"您面部两颧潮红或偏红吗？", k:[["yinxu",0]]},
 {id:"S12", t:"您感到身体沉重不轻松或不爽快吗？", k:[["tanshi",0]]},
 {id:"S13", t:"您腹部肥满松软吗？", k:[["tanshi",0]]},
 {id:"S14", t:"您嘴里有黏黏的感觉吗？", k:[["tanshi",0]]},
 {id:"S15", t:"您面部或鼻部有油腻感或者油亮发光吗？", k:[["shire",0]]},
 {id:"S16", t:"您小便时尿道有发热感、尿色浓（深）吗？", k:[["shire",0]]},

 xueyu:{
  j:{no:"ZYTZ-TY-028", x:"情绪避烦躁。血瘀质易烦健忘，应努力克服烦躁情绪，遇事宜沉稳，保持精神舒畅。如此才可使气血和畅，有益于改善血瘀质。"},
  y:{no:"ZYTZ-TY-029", x:"经络气血运行不畅，应多采用有益于促进气血运行的运动项目，并持之以恒。如各种舞蹈、步行健身法、徒手健身操、易筋经、保健功、导引、按摩、太极拳、太极剑、五禽戏或八段锦等。不宜做大强度、大负荷的体育锻炼，而应采用中小负荷、多次数的锻炼。"},
  s:{no:"ZYTZ-TY-031", x:"宜选用具有调畅气血作用的食物。少食收涩、寒凉、冰冻之物，以及高脂肪、高胆固醇、油腻食物。"},

  y:{no:"ZYTZ-TY-034", x:"运动可以促进气血的流通和运行。宜每天坚持适量的体育锻炼，多参加集体性活动，也可以多参加合唱、下棋、打牌等娱乐活动。集体性活动有助于和人群交流、调畅情志，对气郁质有积极的调理作用。"},

  return [md(dh)+'—'+md(cf), md(cf)+'—'+md(xm), md(xm)+'—'+md(ds), md(ds)+'—'+md(qf), md(qf)+'—'+md(xx), md(xx)+'—'+md(dh2)];
}
function YQ_hhmm(o){ return ('0' + o.h).slice(-2) + ':' + ('0' + o.mi).slice(-2); }

function YQ_mod(n, m){ return ((n % m) + m) % m; }
function YQ_ganzhi(year){ const n = YQ_mod(year - 1984, 60); return YQ_GAN[n % 10] + YQ_ZHI[n % 12]; }

/* 生日 → 运气年：交司日之前归上一年；出生日恰为大寒当日且确知在交司前，勾选后一律归上一年 */
function YQ_birthYear(y, m, d, prev){
  if(prev) return y - 1;
  const h = YQ_daHan(y);
  return (y * 10000 + m * 100 + d < h.y * 10000 + h.m * 100 + h.d) ? y - 1 : y;
}

function YQ_calc(year){
  const gz = YQ_ganzhi(year), gan = gz.charAt(0), zhi = gz.charAt(1);
  const yunElem = YQ_YUN_OF_GAN[gan], tai = !!YQ_YANG[gan];
  const sitian = YQ_SITIAN_OF_ZHI[zhi], zaiquan = YQ_DUIHUA[sitian];

  /* 客气六步：在泉固定终之气，司天固定三之气，其余顺推 */
  const k0 = YQ_KEQI.indexOf(zaiquan), keqi = [];
  for(let i = 0; i < 6; i++) keqi.push(YQ_KEQI[YQ_mod(k0 - 5 + i, 6)]);

  const stimes = YQ_stepTimes(year), steps = [];
  for(let j = 0; j < 6; j++){
    steps.push({no:j+1, zhu:YQ_ZHUQI[j], ke:keqi[j], time:stimes[j]});
  }

  const sitElem = YQ_ELEM[sitian], zaElem = YQ_ELEM[zaiquan], zhiElem = YQ_ZHI_FANGWEI[zhi];
  const flags = [];
  if(sitElem === yunElem) flags.push('天符');
  if(zhiElem === yunElem) flags.push('岁会');
  if(sitElem === yunElem && zhiElem === yunElem) flags.push('太一天符');
  if(tai && zaElem === yunElem) flags.push('同天符');
  if(!tai && zaElem === yunElem) flags.push('同岁会');

  /* 平气：太过被抑、不及得助（RY-YQ-004；年支同气用巳亥全表） */
  let pingQi = false, pingNote = '';
  if(tai){
    if(yunElem === '金' && (sitian === '少阴君火' || sitian === '少阳相火')){ pingQi = true; pingNote = '坚成之纪逢' + sitian + '司天，二火抑金，复为平气'; }
    else if(yunElem === '火' && sitian === '太阳寒水'){ pingQi = true; pingNote = '赫曦之纪逢寒水司天，水抑其火，复为平气'; }
  } else {
    if(sitElem === yunElem){ pingQi = true; pingNote = '不及之运得司天同气之助，同正' + yunElem; }
    else if(YQ_ZHI_ELEM_FULL[zhi] === yunElem){ pingQi = true; pingNote = '不及之运得年支' + zhi + '同气之助，气乃平'; }
    else if(zaElem === yunElem){ pingQi = true; pingNote = '与在泉同气（同岁会），亦气之平'; }
  }

  const yunName = pingQi ? YQ_JI[yunElem].ping : (tai ? YQ_JI[yunElem].tai : YQ_JI[yunElem].bu);

  return {
    year: year, gz: gz, gan: gan, zhi: zhi,
    yunElem: yunElem, tai: tai, yunName: yunName,
    sitian: sitian, zaiquan: zaiquan, keqi: keqi, steps: steps,
    flags: flags, pingQi: pingQi, pingNote: pingNote,
    dahan: YQ_daHan(year), dahanText: YQ_daHan(year).m + '/' + YQ_daHan(year).d + ' ' + YQ_hhmm(YQ_daHan(year))
  };
}

/* 出生日落在运气年的第几之气（0–5） */
function YQ_stepIndex(year, m, d){
  const bounds = YQ_stepBounds(year);
  const t = new Date(year, m - 1, d, 12, 0, 0);
  for(let i = 0; i < 6; i++){ if(t >= bounds[i] && t < bounds[i+1]) return i; }
  return 5;
}

/* 先天底色打分：中运 3 / 司天 2 / 在泉 2 / 出生所在步客气 1；每条第二个标签取半权
   满分 12，换成 0–100 的参考值；只用于排行与图上落点，不进九体判定 */
function YQ_innate(L, stepNo){
  const pts = {};
  const add = (k, w) => { if(!k) return; pts[k] = (pts[k] || 0) + w; };
  const yt = YQ_YUN_TEND[L.yunElem + (L.tai ? '太过' : '不及')] || [];
  add(yt[0], 3); add(yt[1], 1.5);
  const st = YQ_QI_TEND[L.sitian] || [];
  add(st[0], 2); add(st[1], 1);
  const za = YQ_QI_TEND[L.zaiquan] || [];
  add(za[0], 2); add(za[1], 1);
  /* 出生步客气：三之气即司天、终之气即在泉，凡与二者同气者不再重复加一次 */
  const keQi = (L.steps[stepNo] || {}).ke;
  if(keQi && keQi !== L.sitian && keQi !== L.zaiquan){
    const ke = YQ_QI_TEND[keQi] || [];
    add(ke[0], 1);
  }

  const rank = Object.keys(pts).map(k => ({k: k, s: Math.round(pts[k] / 12 * 100)})).sort((a, b) => b.s - a.s);
  const top = rank[0] || null;
  const second = rank[1] || null;
  const keep = rank.filter((x, i) => i === 0 || (x.s >= 20 && x.s >= top.s * 0.55));
  return {all: rank, top: top, second: (keep.length > 1 ? second : null), marks: keep};
}

/* 今天的运气年 */
function YQ_todayYear(){
  const now = new Date(), y = now.getFullYear();
  return (now < YQ_cst(YQ_daHan(y))) ? y - 1 : y;
}

/* 汇总：供结果页调用 */
function YQ_build(){
  if(!birth.y || !birth.m || !birth.d) return null;
  const year = YQ_birthYear(birth.y, birth.m, birth.d, birth.prev);
  const L = YQ_calc(year);
  L.stepNo = YQ_stepIndex(year, birth.m, birth.d);
  L.innate = YQ_innate(L, L.stepNo);
  return L;
}

/* ================= 结果页：先天底色与合判 ================= */
function YQ_birthText(){
  return birth.y + ' 年 ' + birth.m + ' 月 ' + birth.d + ' 日';
}
function YQ_stepText(step){
  return '第 ' + step.no + ' 之气（' + step.time + '）· 主气 ' + step.zhu + ' · 客气 ' + step.ke;
}
function YQ_kindOf(R, inn){
  const A = (inn.marks || []).map(x => x.k);
  if(!R.main) return 'none';
  if(R.main === 'pinghe') return 'pinghe';
  if(A.indexOf(R.main) >= 0) return 'same';
  if(R.mixed.some(k => A.indexOf(k) >= 0)) return 'part';
  return 'diff';
}
function YQ_jointText(kind, innName, mainName){
  const T = {
    same:['同向：先天与后天指同一个方向',
      '问卷判出的' + mainName + '，和出生运气给的底色一致。这类偏颇多半不是一阵子作息熬出来的，而是底子本来如此——调养见效偏慢，重在长期守，不宜来回换方向。',
      '按主体质那一套做就够了；先天这一层只是解释它为什么难改，不额外加任务。'],
    part:['部分同向：先天那层之上，又叠了一层后天的',
      '主体质' + mainName + '不在先天底色里，但兼夹体质和' + innName + '相接。可以理解成两层：先天是一层，后天因素又在上面叠了一层。',
      '先天那层照着底色守，叠上来那层按兼夹处理，两件事分开做，不必合成一句“我体质差”。'],
    diff:['不同向：后天的偏颇盖过了先天底色',
      '先天底色是' + innName + '，问卷判出的是' + mainName + '。常见于作息、饮食、环境、病程这类后天因素把底色盖过去；也可能这层底色本就不显。',
      '调养以' + mainName + '为主，' + innName + '只作背景，不必因为它去硬补。'],
    none:['问卷没判出明显偏颇，先天仍有底色',
      '九体都未到判定线，而先天底色是' + innName + '。说明这层底色目前没被触发，或后天养护已经把它压住了。它是“易感方向”，不是现在的病。',
      '不必照' + innName + '去调，留意它容易显出来的时段就好。'],
    pinghe:['目前平和，先天仍留着一层底色',
      '问卷判为平和（或基本平和），先天底色却偏向' + innName + '。说明后天养护把这一层压住了，这是好事。',
      '按平和质那套维持即可；逢此类气当令的年份与时段，多留一分心。']
  };
  const t = T[kind] || T.none;
  return {h:t[0], a:t[1], b:t[2]};
}
function YQ_triggerLine(k){
  const qi = YQ_TRIGGER[k];
  if(!qi) return '';
  return '这类底色容易显出来的时段：逢' + qi + '司天或在泉的年份，以及每年' + YQ_QI_SEG[qi] + '前后。';
}

function renderLuck(R){
  lastLuck = YQ_build();

  if(L.flags.length || L.pingQi){

  h += '<p class="p">上半年' + esc(L.sitian) + '当令：' + esc(YQ_QI_PLAIN[L.sitian] || '') + '</p>';

  if(inn.top){

  }

     + '本层不改动、也不参与上面的九体分数与主体质判定。</p>';
  card.innerHTML = h;
  out.appendChild(card);

  /* ② 先天 × 后天 合判 */
  const kind = YQ_kindOf(R, inn);

  if(R.main){

    mainName = NAME[R.main];
    mainTxt = mainName + '（' + lv + '）';
    if(R.mixed.length) mainTxt += '　兼夹：' + R.mixed.map(k => NAME[k]).join('、');
  }
  const innTxt = inn.top ? (innName + '（主）' + (inn.second ? '　兼 ' + NAME[inn.second.k] : '')) : '—';
  const J = YQ_jointText(kind, innName, mainName);
  const relTxt = {same:'同向', part:'部分同向', diff:'不同向', none:'底色未显', pinghe:'目前平和'}[kind] || '—';

  const jc = el("div", "joint");

  jh += '<div class="kv"><span>先天底色</span><strong>' + esc(innTxt) + '</strong></div>';
  jh += '<div class="kv"><span>问卷判出</span><strong>' + esc(mainTxt) + '</strong></div>';
  jh += '<div class="kv"><span>两者关系</span><strong>' + esc(relTxt) + '</strong></div>';
  jh += '<p class="verdict-1">' + esc(J.h) + '</p>';
  jh += '<p class="p">' + esc(J.a) + '</p>';
  jh += '<p class="p">' + esc(J.b) + '</p>';
  const trig = inn.top ? YQ_triggerLine(inn.top.k) : '';
  if(trig) jh += '<p class="p">' + esc(trig) + '</p>';
  jc.innerHTML = jh;
  out.appendChild(jc);
}

/* 时令页里的今年运气一行 */
function YQ_todayLine(){
  const y = YQ_todayYear(), L = YQ_calc(y);
  return '【今年】' + L.gz + '年：' + L.yunElem + '运' + (L.tai ? '太过' : '不及')
    + '，' + L.sitian + '司天、' + L.zaiquan + '在泉。这是全年的气候大势，与上面对你个人的判定分开看。';

<script>

  const done = Q27.every(q => (q.g && q.g !== sex) ? true : answers[q.id] != null);
  if (!done) return false;
  const r = rawOf("tebing");
  return r.conv != null && r.conv >= 30;
}

/* P35（特禀过敏原）是否在列：按当前答案现算 */
function pageOn(p) { return !(p && p.id === "P35" && !tebingHit()); }

  for (let t = i; t >= 0 && t < pages.length; t += dir) if (pageOn(pages[t])) return t;
  return -1;
}
function onUpto(i) { let n = 0; for (let t = 0; t <= i && t < pages.length; t++) if (pageOn(pages[t])) n++; return n; }
function onTotal() { return onUpto(pages.length - 1); }

      c.appendChild(grid);
      c.appendChild(noteEl);
      c.appendChild(prevWrap);

      if(birth.y) ySel.value = String(birth.y);
      if(birth.m) mSel.value = String(birth.m);
      fillDays();
      if(birth.d) dSel.value = String(birth.d);
      refresh();
    } else {
      c.dataset.qid = p.id;
      c.appendChild(el("h3", null, p.t));
      if (p.note) c.appendChild(el("p", "note", p.note));
      const isScale = p.o.length === 5 && p.o[0] === OPTS5[0];
      if (isScale) c.appendChild(el("p", "note", "不必纠结精确，选最接近的一档就好。"));
      const box = el("div", isScale ? "scale" : "choices");
      let cap = null;
      p.o.forEach((label, j) => {
        const v = j + 1;
        const b = el("button", isScale ? ("segBtn t" + v) : "choice");
        b.type = "button";
        if (answers[p.id] === v) b.classList.add("on");
        if (isScale) {
          const parts = label.split("（");
          b.innerHTML = "<b>" + esc(parts[0]) + "</b><i>" + esc((parts[1] || "").replace(/）$/, "")) + "</i>";
        } else {
          b.innerHTML = "<span>" + esc(label) + "</span>";
        }
        b.addEventListener("click", () => {
          answers[p.id] = v;
          [...box.children].forEach(x => x.classList.remove("on"));
          b.classList.add("on");
          if (cap) cap.textContent = "已选：" + label;
          syncBar();
        });
        box.appendChild(b);
      });
      c.appendChild(box);
      if (isScale) {
        cap = el("p", "scale-note", answers[p.id] != null ? "已选：" + p.o[answers[p.id] - 1] : "点一档，再按「下一题」");
        c.appendChild(cap);
      }
    }
    deck.appendChild(c);
  });
  const at = startAt != null ? startAt : (keep ? Math.max(0, pages.findIndex(p => p.id === keep)) : 0);
  go(at);
}

function go(i, dir) {
  if (!pages.length) return;
  let t = Math.max(0, Math.min(pages.length - 1, i));
  if (!pageOn(pages[t])) {                       // 落在被隐藏的 P35 上，就往行进方向找下一张
    const n = nextOn(t, dir === -1 ? -1 : 1);
    if (n >= 0) t = n;
  }
  idx = t;
  const cards = $("#deck").children;
  const cur = cards[idx];
  const prev = lastIdx >= 0 ? cards[lastIdx] : null;
  const tok = ++fadeTok;
  // 旧卡若正在显示，先量高度，再把它做成浮层淡出；新卡原地淡入——中间不留空白帧
  const prevH = (prev && prev !== cur && !prev.hidden) ? prev.offsetHeight : 0;
  [...cards].forEach(c => { c.style.cssText = ""; });     // 清掉上一轮过渡留在行内的样式
  [...cards].forEach((c, k) => { c.hidden = k !== idx; });
  cur.classList.remove("shake");
  if (prevH) {
    Object.assign(prev.style, {position: "absolute", left: "0", right: "0", top: "0",
      height: prevH + "px", zIndex: "2", pointerEvents: "none", opacity: "1", transition: "opacity .18s ease"});
    prev.hidden = false;
    requestAnimationFrame(() => { if (tok === fadeTok) prev.style.opacity = "0"; });
  }
  cur.style.transition = "none";
  cur.style.opacity = "0.6";
  cur.style.transform = "translateY(6px)";
  requestAnimationFrame(() => {
    if (tok !== fadeTok) return;
    cur.style.transition = "opacity .22s ease, transform .22s ease";
    cur.style.opacity = "1";
    cur.style.transform = "translateY(0)";
  });
  setTimeout(() => {
    if (tok !== fadeTok) return;                    // 已被下一轮接手，不做收尾
    [...cards].forEach(c => {
      if (c !== $("#deck").children[idx]) c.hidden = true;
      c.style.cssText = "";
    });
  }, 240);
  lastIdx = idx;
  const isSexPage = pages[idx].sex && !sex;
  const total = onTotal(), curNo = onUpto(idx);
  $("#seg").textContent = isSexPage ? "第 1 题" : (pages[idx].birth ? "出生信息" : "第 " + curNo + " / " + total + " 题");
  $("#stage").textContent = pages[idx].sex ? "性别" : (pages[idx].birth ? "出生" : pages[idx].seg);
  const kick = cur.children[0];
  if (kick && kick.className === "kicker" && !pages[idx].birth) kick.textContent = "第 " + curNo + " / " + total + " 题";
  $("#pct").textContent = isSexPage ? "开始" : Math.round(curNo / total * 100) + "%";
  $("#fill").style.width = (isSexPage ? 0 : curNo / total * 100) + "%";
  $("#prev").disabled = nextOn(idx - 1, -1) < 0;
  $("#next").textContent = nextOn(idx + 1, 1) < 0 ? "查看结果" : "下一题";
  syncBar();
  cur.scrollIntoView({block: "nearest"});
}

function syncBar() {
  const answered = pages.filter(p => p.id && answers[p.id] != null).length;
  $("#seg").title = "已答 " + answered + " 题";
}

function nudge(msg) {
  const cur = $("#deck").children[idx];
  if (cur) {
    cur.classList.remove("shake");
    void cur.offsetWidth;
    cur.classList.add("shake");
  }
  const t = $("#toast");
  t.textContent = msg || "这一题还没选，选好再往下";
  t.classList.add("show");
  clearTimeout(nudge._tm);
  nudge._tm = setTimeout(() => t.classList.remove("show"), 1800);
}

function advance() {
  const p = pages[idx];
  if (p.sex) {
    if (!sex) { nudge("请先确认性别"); return; }
    go(idx + 1);
    return;
  }
  if (p.birth) {
    if (!birth.y || !birth.m || !birth.d) { nudge("请先选好出生年月日"); return; }
    go(idx + 1);
    return;
  }
  if (answers[p.id] == null) { nudge("这一题还没选，选好再往下"); return; }
  const n = nextOn(idx + 1, 1);                // 后面的 P35 若已不该出现，直接跳过
  if (n < 0) { submitNow(); return; }
  go(n);
}

function submitNow() {
  const left = pages.filter(p => p.id && pageOn(p) && answers[p.id] == null).length;
  if (left) { nudge("还有 " + left + " 题没答，回去补齐再出结果"); return; }
  $("#deckWrap").hidden = true;
  renderResult();
}

function resetAll() {
  Object.keys(answers).forEach(k => delete answers[k]);
  sex = "";
  birth.y = null; birth.m = null; birth.d = null; birth.prev = false;
  lastLuck = null;
  lastResult = null;                 // 重答后不保留上一次结果，避免误触导出拿到旧数据
  $("#result").style.display = "none";
  $("#result").innerHTML = "";
  $("#deckWrap").hidden = false;
  buildDeck();
  window.scrollTo({top: 0});
}

/* ================= 计分 ================= */
function rawOf(key) {
  let raw = 0, miss = 0, cnt = 0;
  Q27.forEach(q => {
    const hit = q.k.find(k => k[0] === key);
    if (!hit) return;
    if (q.g && q.g !== sex) return;                 // 性别专属题不计
    cnt++;
    const v = answers[q.id];
    if (v == null) { miss++; return; }
    raw += hit[1] ? (6 - v) : v;
  });
  if (cnt === 0) return {raw: null, n: N[key], conv: null, miss: 0};
  const n = cnt;                                   // 湿热：只会命中一道性别题，n=3
  if (miss > 0) return {raw: null, n: n, conv: null, miss: miss};
  return {raw: raw, n: n, conv: (raw - n) / (n * 4) * 100, miss: 0};
}

function judge() {
  const conv = {}, detail = {};
  ORDER.forEach(k => {
    const r = rawOf(k);
    detail[k] = r;
    conv[k] = r.conv;
  });
  const bad = ORDER.filter(k => k !== "pinghe");
  const known = bad.filter(k => conv[k] != null);      // 已答、可参与比的
  const missing = bad.filter(k => conv[k] == null);    // 漏答，不判也不参与平和质的比较
  const badYes = known.filter(k => conv[k] >= 40)
                      .sort((a, b) => conv[b] - conv[a]);
  const badTend = known.filter(k => conv[k] >= 30 && conv[k] < 40)
                       .sort((a, b) => conv[b] - conv[a]);
  const p = conv.pinghe;
  let pingheLevel = "否";
  // 「其余八项都低」只拿已答项比：漏答项不进 every，否则漏一题就把平和质误压成「否」
  if (p != null && p >= 60 && known.length > 0) {
    const allUnder30 = known.every(k => conv[k] < 30);
    const allUnder40 = known.every(k => conv[k] < 40);
    if (allUnder30) pingheLevel = "是";
    else if (allUnder40) pingheLevel = "基本是";
  }
  let main = null, mainLevel = "";
  if (pingheLevel === "是" || pingheLevel === "基本是") { main = "pinghe"; mainLevel = pingheLevel; }
  else if (badYes.length) { main = badYes[0]; mainLevel = "是"; }
  else if (badTend.length) { main = badTend[0]; mainLevel = "倾向是"; }
  const mixed = badYes.filter(k => k !== main).slice(0, 3);
  return {conv: conv, detail: detail, main: main, mainLevel: mainLevel, mixed: mixed,
          badYes: badYes, badTend: badTend, pingheLevel: pingheLevel, missing: missing};
}

  // P33 环境
  if (a(33)) push("环境", 33, ADVICE.P33[a(33) - 1]);

/* 把行内编号（NJG-TY-xxx / ZYTZ-TY-xxx）抽出来，正文里只留文字，编号统一附在句尾小字 */
function splitCite(text) {
  const refs = [];
  const body = String(text)
    .replace(/((?:NJG|ZYTZ)-TY-\d{3})/g, m => { refs.push(m); return ""; })
    .replace(/\s*＋\s*/g, "＋")
    .replace(/^[\s＋+；;、]+/, "")
    .replace(/[\s＋+；;、]+$/g, "")
    .replace(/\s+/g, " ")
    .trim();
  return {text: body, refs: refs};
}

      '<p>五运六气口径：运气年以当年真实大寒交司日为界，只按公历日期判定，不含时辰与出生地；先天底色只作对照，不改动上面九体的分数与结论。</p>'
      + '<p>本页不构成诊断，不给药名、不给克数、不给方名、不作疾病预测。身体不适请就医。</p>';

/* ================= 分享长图（canvas 手绘，不依赖任何外部库） =================
   用途：结果页一键出图，省掉截长图。图上只复述页面上已有的结论与口径，
   不新增判断、不新增建议、不改九体分数。宽 1080，高度按内容自动算。 */
const SHOT_W = 1080, SHOT_PAD = 64, SHOT_CW = SHOT_W - SHOT_PAD * 2;
const SHOT_INK = "#2c2c2c", SHOT_INK2 = "#8a7a5a", SHOT_SEAL = "#a83226";
const SHOT_LINE = "#d4c5a0", SHOT_BAR = "#e4d8b8";
const SHOT_FAMILY = '-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Heiti SC",sans-serif';
let _shotMC = null;

function shotFont(size, weight) { return String(weight || 400) + " " + size + "px " + SHOT_FAMILY; }
function shotMeasure() {
  if (!_shotMC) _shotMC = document.createElement("canvas").getContext("2d");
  return _shotMC;
}
/* 按像素宽度折行：逐字量，中文按字、英文按字符，够用 */
function shotWrap(str, maxW, font) {
  const mc = shotMeasure();
  mc.font = font;
  const s = String(str == null ? "" : str);
  const out = [];
  let cur = "";
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === "\n") { out.push(cur); cur = ""; continue; }
    if (cur.length && mc.measureText(cur + ch).width > maxW) { out.push(cur); cur = ch; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}

/* —— 「详细全图」用：把结果页 DOM 里的文字按块取出来，不改写、不重排语义 —— */
function shotClean(s) { return String(s == null ? "" : s).replace(/[\s\u00a0]+/g, " ").trim(); }
function shotJoinInline(el) {
  const parts = [];
  for (let i = 0; i < el.children.length; i++) parts.push(shotClean(el.children[i].textContent));
  return parts.filter(Boolean).join("　");
}
function shotText(el) {
  const cls = " " + (el && el.className || "") + " ";
  if ((cls.indexOf(" kv ") >= 0 || cls.indexOf(" chips ") >= 0) && el.children.length) return shotJoinInline(el);
  return shotClean(el.textContent);
}
/* 逐个抓 #result 的直接子块：折叠块拿标题＋正文，其余卡片拿 p / dt / dd / .kv / .chips */
function shotFullSections() {
  const out = [];
  const res = $("#result");
  if (!res || !res.children) return out;
  const skip = ["row-actions", "shot-mask", "shot-pick", " bars ", " verdict ", " foot "];
  for (let i = 0; i < res.children.length; i++) {
    const ch = res.children[i];
    const cls = " " + (ch.className || "") + " ";
    if (skip.some(function (s) { return cls.indexOf(s) >= 0; })) continue;
    if (cls.indexOf(" fold ") >= 0) {
      const t = ch.querySelector(".fold-h .t");
      out.push({h: shotClean(t ? t.textContent : "")});
      const ps = ch.querySelectorAll(".fold-b p, .fold-b li");
      for (let j = 0; j < ps.length; j++) {
        const txt = shotText(ps[j]);
        if (txt) out.push({t: txt, c: " " + (ps[j].className || "") + " "});
      }
      continue;
    }
    const ps = ch.querySelectorAll("p, dt, dd, li, .kv, .chips");
    for (let j = 0; j < ps.length; j++) {
      const txt = shotText(ps[j]);
      if (!txt) continue;
      const tag = ps[j].tagName === "DT" ? " dt " : (ps[j].tagName === "DD" ? " dd " : " ");
      out.push({t: txt, c: " " + (ps[j].className || "") + tag});
    }
  }
  return out;
}
/* 夜色按原 class 分级：大标题、判语、说明、小注各不相同 */
function shotBlockStyle(c) {
  c = " " + (c || "") + " ";
  if (c.indexOf(" big ") >= 0) return {size: 32, weight: 700, lh: 48, gap: 4};
  if (c.indexOf(" verdict-1 ") >= 0) return {size: 29, weight: 700, lh: 44, gap: 4};
  if (c.indexOf(" lead ") >= 0) return {size: 25, weight: 700, color: SHOT_INK2, lh: 38, gap: 2};
  if (c.indexOf(" who ") >= 0) return {size: 26, weight: 700, lh: 40, gap: 2};
  if (c.indexOf(" thr ") >= 0) return {size: 24, color: SHOT_SEAL, lh: 38, gap: 2};
  if (c.indexOf(" tagline ") >= 0 || c.indexOf(" fine ") >= 0 || c.indexOf(" subline ") >= 0)
    return {size: 22, color: SHOT_INK2, lh: 33, gap: 2};
  if (c.indexOf(" dt ") >= 0) return {size: 24, weight: 700, color: SHOT_INK2, lh: 36, gap: 0};
  if (c.indexOf(" dd ") >= 0) return {size: 24, lh: 36, gap: 2};
  return {size: 24, lh: 38, gap: 4};
}
/* 出图方式选择：一份结论速览，一份整页详版 */
function chooseShot() {
  const mask = el("div", "shot-pick");
  const box = el("div", "shot-pick-box");
  box.appendChild(el("p", "shot-pick-t", "生成图片"));
  box.appendChild(el("p", "shot-pick-s", "先选一份：速览图便于转发，详版图把结果页整页排进一张长图。生成后可长按保存。"));
  const close = function () { if (mask.parentNode) mask.parentNode.removeChild(mask); };
  const makeOpt = function (title, desc, type) {
    const b = el("button", "shot-opt");
    b.type = "button";
    b.innerHTML = "<b>" + title + "</b><span>" + desc + "</span>";
    b.addEventListener("click", function () { close(); openShot(type); });
    return b;
  };
  box.appendChild(makeOpt("体质分析图", "判定结果＋九体分＋先天运气＋合判解读，两屏以内，适合发朋友圈。", "brief"));
  box.appendChild(makeOpt("详细全图", "结果页整页内容：判定、九体分、先天运气、合判、开篇总纲、精神运动饮食起居、宜与少食清单、时令、按你的情况、安全线与免责。", "full"));
  const x = el("button", "ghost shot-pick-x", "取消");
  x.type = "button";
  x.addEventListener("click", close);
  box.appendChild(x);
  mask.appendChild(box);
  mask.addEventListener("click", function (e) { if (e.target === mask) close(); });
  document.body.appendChild(mask);
}

/* 只排版不入画：先算高度，再一次性画 */
function shotBuild(type) {
  type = type || "brief";
  const R = lastResult;
  if (!R) return null;
  const L = lastLuck;
  const ops = [];
  let y = 0, H = 0;
  const CW = SHOT_CW;

  function line(str, o) {
    o = o || {};
    const size = o.size || 26;
    const f = shotFont(size, o.weight);
    const lh = o.lh || Math.round(size * 1.62);
    const lines = shotWrap(str, o.w || CW, f);
    const yy = y, x = SHOT_PAD + (o.indent || 0);
    ops.push(function (c) {
      c.font = f; c.fillStyle = o.color || SHOT_INK;
      c.textBaseline = "top"; c.textAlign = "left";
      for (let i = 0; i < lines.length; i++) c.fillText(lines[i], x, yy + i * lh);
    });
    y = yy + lines.length * lh + (o.gap || 0);
  }

  function rule(gapTop, gapBottom) {
    y += (gapTop || 0);
    const yy = y;
    ops.push(function (c) { c.fillStyle = SHOT_LINE; c.fillRect(SHOT_PAD, yy, CW, 1); });
    y = yy + 1 + (gapBottom || 0);
  }

  function kicker(t) {
    y += 20;
    const yy = y;
    ops.push(function (c) {
      c.fillStyle = SHOT_SEAL; c.fillRect(SHOT_PAD, yy + 6, 5, 24);
      c.font = shotFont(26, 700); c.fillStyle = SHOT_INK2;
      c.textBaseline = "top"; c.textAlign = "left";
      c.fillText(t, SHOT_PAD + 18, yy);
    });
    y = yy + 38;
  }

  function kv(k, v) {
    const kf = shotFont(25, 700), vf = shotFont(25, 400), kw = 158, lh = 40;
    const lines = shotWrap(v, CW - kw, vf);
    const yy = y;
    ops.push(function (c) {
      c.textBaseline = "top"; c.textAlign = "left";
      c.font = kf; c.fillStyle = SHOT_INK2; c.fillText(k, SHOT_PAD, yy + 1);
      c.font = vf; c.fillStyle = SHOT_INK;
      for (let i = 0; i < lines.length; i++) c.fillText(lines[i], SHOT_PAD + kw, yy + i * lh);
    });
    y = yy + Math.max(lines.length, 1) * lh + 4;
  }

  function barRow(name, val, hasVal) {
    const lw = 168, rh = 44, bx = SHOT_PAD + lw, bw = CW - lw - 96;
    const yy = y;
    ops.push(function (c) {
      c.textBaseline = "middle";
      c.font = shotFont(25, 700); c.fillStyle = SHOT_INK;
      c.fillText(name, SHOT_PAD, yy + rh / 2);
      c.fillStyle = SHOT_BAR; c.fillRect(bx, yy + rh / 2 - 8, bw, 16);
      if (hasVal) {
        const p = Math.max(0, Math.min(100, val)) / 100;
        c.fillStyle = val >= 30 ? SHOT_SEAL : "#b8a682";
        c.fillRect(bx, yy + rh / 2 - 8, Math.round(bw * p), 16);
      }
      c.font = shotFont(23, 400); c.fillStyle = SHOT_INK2; c.textAlign = "right";
      c.fillText(hasVal ? val.toFixed(1) : "信息不足", SHOT_W - SHOT_PAD, yy + rh / 2);
      c.textAlign = "left";
    });
    y = yy + rh;
  }

  /* ① 抬头 */
  y = SHOT_PAD;
  line("中医体质自测 · 九体＋五运六气合判", {size: 44, weight: 700, lh: 58, gap: 4});
  line("九种体质 · 判定 27 题＋补充 7 题 · 出生运气对照", {size: 24, color: SHOT_INK2, lh: 34, gap: 2});
  line("GB/T 46939—2025 ＋ 五运六气（大寒换年）　·　生成于 " + nowStamp().slice(0, 16),
    {size: 23, color: SHOT_INK2, lh: 34, gap: 4});
  rule(4, 8);

  /* ② 判定结果 */
  kicker("判定结果");
  const mainName = R.main ? NAME[R.main] : null;
  if (mainName) {
    line(mainName, {size: 60, weight: 700, color: SHOT_SEAL, lh: 78, gap: 2});
    const lv = R.mainLevel === "是" ? "判为"
      : (R.mainLevel === "基本是" ? "基本判为"
        : (R.mainLevel === "倾向是" ? "倾向是" : ""));
    let sub = "主体质判定：" + (lv || "—");
    if (R.mixed && R.mixed.length) sub += "　·　兼夹：" + R.mixed.map(k => NAME[k]).join("、");
    line(sub, {size: 26, gap: 2});
  } else {
    line("九体均未达判定线", {size: 44, weight: 700, color: SHOT_SEAL, lh: 60, gap: 2});
    line("本次不给主体质结论。原因通常是漏答，或隔一段时间重测更准。", {size: 26, gap: 2});
  }
  if (R.missing && R.missing.length) line("漏答：" + R.missing.length + " 项，未计入判定。", {size: 23, color: SHOT_INK2, gap: 2});

  /* ③ 九体分条 */
  kicker("九体转化分（0—100）");
  ORDER.forEach(function (k) {
    const v = R.conv[k];
    barRow(NAME[k], v == null ? 0 : v, v != null);
  });
  line("红色为已达 30（倾向线）以上，判定线在 40。条目少的体质原始分偏低，转换分算到负数属正常现象，不影响判定与排序。",
    {size: 21, color: SHOT_INK2, lh: 32, gap: 0});

  if (type === "full") {
    /* 详细全图：把结果页 DOM 里的每一块文字按原顺序搬进来；键值对（dt/dd）合成一行 */
    const secs = shotFullSections();
    for (let i = 0; i < secs.length; i++) {
      const b = secs[i], bc = " " + (b.c || "") + " ";
      if (b.h) { kicker(b.h); continue; }
      const nx = secs[i + 1] ? " " + (secs[i + 1].c || "") + " " : " ";
      if (bc.indexOf(" dt ") >= 0 && nx.indexOf(" dd ") >= 0) { kv(b.t, secs[i + 1].t); i++; continue; }
      if (bc.indexOf(" dd ") >= 0) continue;
      line(b.t, shotBlockStyle(b.c));
    }
  } else {
  /* ④ 先天气化 */
  const inn = L ? L.innate : null;
  const step = L ? L.steps[L.stepNo] : null;
  if (L && step) {
    kicker("先天气化底色（出生运气 · 大寒换年）");
    line(String(L.year) + "　" + L.gz + " 年", {size: 40, weight: 700, lh: 54, gap: 2});
    kv("出生", YQ_birthText());
    kv("年起点", "大寒 " + L.dahanText + "（北京时间）");
    kv("岁运", L.yunElem + "运" + (L.tai ? "太过" : "不及") + "　·　" + L.yunName);
    kv("司天", L.sitian + "（管上半年，落" + (YQ_QI_ZANG[L.sitian] || "") + "）");
    kv("在泉", L.zaiquan + "（管下半年，落" + (YQ_QI_ZANG[L.zaiquan] || "") + "）");
    kv("出生时", YQ_stepText(step));
    kv("先天底色", inn.top ? (NAME[inn.top.k] + "（主）" + (inn.second ? "　兼 " + NAME[inn.second.k] : "")) : "—");
    if (L.flags && L.flags.length) kv("标记", L.flags.join("、") + (L.pingQi ? "、平气" : ""));
  }

  /* ⑤ 先天 × 后天 */
  if (L && inn) {
    const kind = YQ_kindOf(R, inn);
    const innName = inn.top ? NAME[inn.top.k] : "—";
    const J = YQ_jointText(kind, innName, mainName || "未判定");
    const rel = {same: "同向", part: "部分同向", diff: "不同向", none: "底色未显", pinghe: "目前平和"}[kind] || "—";
    kicker("先天 × 后天");
    kv("先天底色", innName + (inn.second ? "（兼 " + NAME[inn.second.k] + "）" : ""));
    kv("问卷判出", mainName ? (mainName + "（" + (R.mainLevel || "") + "）") : "九体均未达判定线");
    kv("两者关系", rel);
    line(J.h, {size: 29, weight: 700, gap: 4});
    line(J.a, {size: 25, gap: 6});
    line(J.b, {size: 25, gap: 4});
    const trig = inn.top ? YQ_triggerLine(inn.top.k) : "";
    if (trig) line(trig, {size: 24, color: SHOT_INK2, gap: 2});
  }

  /* ⑥ 时令 */
  const si = seasonNow(), S = SEASON[si];
  kicker("现值季节");
  line(S.name + "季（" + SEASON_SPAN[si] + "）　·　按今天 " + seasonToday() + " 自动判定", {size: 25, gap: 2});
  line("【时令】" + S.name + "：" + S.x, {size: 25, gap: 2});
  const fix = (SEASON_FIX[R.main] || [])[si];
  if (fix) line(fix, {size: 23, color: SHOT_INK2, gap: 2});

  }

  /* ⑦ 页脚 */
  rule(14, 6);
  line("本图由自测页自动生成，属健康科普参考，不替代面诊，不构成诊疗或用药建议，不给方名与克数，不作疾病预测。身体不适请就医。",
    {size: 21, color: SHOT_INK2, lh: 31, gap: 2});
  line("文案：《中医体质学》（王琦，2021 规划教材）第九章、《素问·四气调神大论》，编号 ZYTZ-TY-001～049、NJG-TY-006～012，原文照录。",
    {size: 20, color: SHOT_INK2, lh: 29, gap: 2});
  line(APP_VERSION, {size: 19, color: "#bbaa8a", gap: 0});

  H = y + SHOT_PAD;
  ops.unshift(function (c) {
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#f6f0e1"); g.addColorStop(1, "#ece3cb");
    c.fillStyle = g; c.fillRect(0, 0, SHOT_W, H);
  });
  return {ops: ops, height: H};
}

function shotToast(msg) {
  const t = $("#toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(shotToast._tm);
  shotToast._tm = setTimeout(function () { t.classList.remove("show"); }, 2600);
}

/* 画一张；失败就提示，不吞掉 */
function makeShot(type) {
  try {
    const built = shotBuild(type);
    if (!built) { shotToast("还没有可生成的结果"); return null; }
    const cv = document.createElement("canvas");
    cv.width = SHOT_W; cv.height = built.height;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#f2ebd8"; ctx.fillRect(0, 0, SHOT_W, built.height);
    built.ops.forEach(function (fn) { fn(ctx); });
    let url = "";
    try { url = cv.toDataURL("image/png"); } catch (err) { shotToast("浏览器拒绝生成图片，先用截图代替"); return null; }
    return {url: url, h: built.height};
  } catch (err) {
    shotToast("生成失败：" + (err && err.message ? err.message : err));
    return null;
  }
}

function openShot(type) {
  const shot = makeShot(type);
  if (!shot) return;
  const mask = el("div", "shot-mask");
  const box = el("div", "shot-box");
  box.appendChild(el("p", "shot-hint",
    "手机上长按图片可存进相册；电脑端点「保存图片」。图宽 1080 像素，可直接发微信或朋友圈。"));
  const img = document.createElement("img");
  img.className = "shot-img";
  img.src = shot.url;
  img.alt = "中医体质自测结果长图";
  box.appendChild(img);
  const acts = el("div", "shot-acts");
  const a = document.createElement("a");
  a.className = "primary";
  a.href = shot.url;
  a.setAttribute("download", "中医体质自测_" + (type === "full" ? "详版_" : "分析_") + nowStamp().replace(/[:\s]/g, "-") + ".png");
  a.textContent = "保存图片";
  const b = el("button", "ghost", "关闭");
  b.type = "button";
  const close = function () { if (mask.parentNode) mask.parentNode.removeChild(mask); };
  b.addEventListener("click", close);
  acts.appendChild(a); acts.appendChild(b);
  box.appendChild(acts);
  mask.appendChild(box);
  mask.addEventListener("click", function (e) { if (e.target === mask) close(); });
  document.body.appendChild(mask);
}

/* ================= 导出 CSV ================= */
function nowStamp() {
  const d = new Date(), z = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()) + " "
    + z(d.getHours()) + ":" + z(d.getMinutes()) + ":" + z(d.getSeconds());
}

function exportCSV() {
  if (!lastResult) return;
  const rows = [["题号", "题型", "题干", "答案序号", "答案文字"]];
  Q27.forEach(q => {
    if (q.g && q.g !== sex) return;
    const v = answers[q.id];
    rows.push([q.id, "判定", q.t, v, v == null ? "" : OPTS5[v - 1]]);
  });
  Q8.forEach(q => {
    if (q.id === "P35" && answers.P35 == null) return;
    const v = answers[q.id];
    rows.push([q.id, "补充", q.t, v, v == null ? "" : q.o[v - 1]]);
  });
  rows.push([]);
  rows.push(["体质", "条目数", "原始分", "转化分", "结论"]);
  ORDER.forEach(k => {
    const r = lastResult.detail[k];
    let verdict = "否";
    if (k === "pinghe") verdict = lastResult.pingheLevel;
    else if (r.conv != null && r.conv >= 40) verdict = "是";
    else if (r.conv != null && r.conv >= 30) verdict = "倾向是";
    if (r.conv == null) verdict = "信息不足";
    rows.push([NAME[k], r.n, r.raw == null ? "" : r.raw, r.conv == null ? "" : r.conv.toFixed(2), verdict]);
  });
  rows.push([]);
  rows.push(["主体质", lastResult.main ? NAME[lastResult.main] : "未判定"]);
  rows.push(["兼夹", lastResult.mixed.map(k => NAME[k]).join("、")]);
  rows.push(["性别", sex === "f" ? "女" : "男"]);
  if (lastLuck) {
    const kind = YQ_kindOf(lastResult, lastLuck.innate);
    rows.push(["出生日期", YQ_birthText()]);
    rows.push(["运气年", lastLuck.year + " " + lastLuck.gz]);
    rows.push(["岁运", lastLuck.yunElem + "运" + (lastLuck.tai ? "太过" : "不及") + "·" + lastLuck.yunName]);
    rows.push(["司天", lastLuck.sitian]);
    rows.push(["在泉", lastLuck.zaiquan]);
    rows.push(["出生所在步", YQ_stepText(lastLuck.steps[lastLuck.stepNo])]);
    rows.push(["先天底色", (lastLuck.innate.top ? NAME[lastLuck.innate.top.k] : "") + (lastLuck.innate.second ? "兼" + NAME[lastLuck.innate.second.k] : "")]);
    rows.push(["先天后天关系", {same:"同向",part:"部分同向",diff:"不同向",none:"底色未显",pinghe:"目前平和"}[kind] || ""]);
  }
  rows.push([]);
  rows.push(["记录信息", ""]);
  rows.push(["导出时间", nowStamp()]);
  rows.push(["问卷版本", APP_VERSION]);
  rows.push(["条目集", "判定 27 题（GB/T 46939—2025）＋补充 7 题，S17/女、S18/男 各一题按性别取一；季节按导出当日日期自动判定"]);
  rows.push(["计分口径", "转化分=(原始分-条目数)/(条目数×4)×100；非平和 ≥40 为「是」、30–40 为「倾向是」；平和质需自身 ≥60 且其余八项 <30（是）/<40（基本是）"]);
  rows.push(["漏答项", lastResult.missing.length ? lastResult.missing.map(k => NAME[k]).join("、") : "无"]);
  const si = seasonNow();            // 只取一次，避免跨午夜时名字与区间来自不同判定
  rows.push(["判定季节", SEASON[si].name + "季（" + SEASON_SPAN[si] + "，按 " + seasonToday() + " 自动判定）"]);
  const csv = rows.map(r => r.map(c => {
    const s = c == null ? "" : String(c);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], {type: "text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "体质自测_答题记录_" + new Date().toISOString().slice(0, 10) + ".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/* ================= 启动 ================= */
$("#next").addEventListener("click", advance);
$("#prev").addEventListener("click", () => go(idx - 1, -1));

document.addEventListener("keydown", e => {
  if ($("#deckWrap").hidden) return;
  if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;  // 焦点在控件上时不抢方向键
  const p = pages[idx];
  if (!p) return;
  if (/^[1-5]$/.test(e.key)) {
    const card = $("#deck").children[idx];
    // 判定题的五级刻度是 .segBtn，补充题与性别页是 .choice，两种都要认
    const bs = card ? card.querySelectorAll(".choice, .segBtn") : null;
    if (bs && bs[Number(e.key) - 1]) bs[Number(e.key) - 1].click();
  } else if (e.key === "ArrowRight") {
    advance();
  } else if (e.key === "ArrowLeft") {
    go(idx - 1, -1);
  }
});

buildDeck();
